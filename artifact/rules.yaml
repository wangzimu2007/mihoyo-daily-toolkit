# 辅助套装：副词条带「元素充能效率」就保留（辅助堆充能是硬需求，不看有效词条数）
support_sets:
  [昔日宗室之仪, 千岩牢固, 翠绿之影, 深林的记忆, 华馆梦醒形骸记, 海染砗磲,
   烬城勇者绘卷, 昔时之歌, 纺月的夜歌, 乐园遗落之花, 饰金之梦, 沙上楼阁史话]
support_keep_subs: [元素充能效率]
# 充能门槛：只对「已强化」的件生效（+0 的有充能就留，留作胚子）。1.4 条 ≈ 9.07%，正好等于「强化到 2 条充能」
support_er_min_rolls: 1.4
# 四星例外保留：四星默认分解，但这些套装/部位值得留一部分（社区口径）
#   mains    : 主词条命中则算候选
#   sub_any  : 或者副词条命中（花羽没有主词条竞争，靠这个捞）
#   max_per_slot: 每个部位最多留几件（按有效词条+双暴排序取前 N）
four_star_keep:
  # 四星默认分解；下列套装/部位例外保留。mains=主词条命中，sub_any=副词条命中，
  # max_per_slot=每部位最多留几件（按有效词条+双暴排序取前 N）
  教官:                     # 4件套：触发反应全队 +120 精通，辅助神套
    mains: [元素精通, 元素充能效率, 暴击率, 暴击伤害, 生命值%, 攻击力%, 防御力%]
    sub_any: [元素充能效率, 元素精通]
    max_per_slot: 5
  流放者:                   # 4件套：回能，辅助向
    mains: [元素充能效率]
    sub_any: [元素充能效率]
    max_per_slot: 2
  赌徒:                     # 4件套：击杀清除元素战技冷却，个别玩法有用
    mains: [元素充能效率, 暴击率, 暴击伤害, 元素精通]
    sub_any: [元素充能效率, 暴击率, 暴击伤害]
    max_per_slot: 3
  学士:                     # 4件套：微粒给弓/法器回能
    mains: [元素充能效率]
    sub_any: [元素充能效率]
    max_per_slot: 2
  祭水之人:                 # 祭X之人：4件套减相应元素伤害，过渡向
    mains: [元素充能效率, 暴击率, 暴击伤害]
    max_per_slot: 2
  祭火之人:
    mains: [元素充能效率, 暴击率, 暴击伤害]
    max_per_slot: 2
  祭雷之人:
    mains: [元素充能效率, 暴击率, 暴击伤害]
    max_per_slot: 2
  祭冰之人:
    mains: [元素充能效率, 暴击率, 暴击伤害]
    max_per_slot: 2
  战狂:                     # 2件套暴击率+12%，前期过渡
    mains: [暴击率, 暴击伤害, 攻击力%]
    max_per_slot: 2
  武人:                     # 2件套普攻+15%
    mains: [攻击力%, 暴击率, 暴击伤害]
    max_per_slot: 2
  # 兜底：其它低星四件套，只留好主词条，每部位最多 2 件
  游医:                     # 2件套治疗加成，治疗辅助过渡
    mains: [治疗加成, 元素充能效率, 生命值%]
    max_per_slot: 2
  勇者之心:                 # 4件套攻击力提升，过渡向
    mains: [攻击力%, 元素充能效率, 暴击率, 暴击伤害]
    max_per_slot: 2
  奇迹:                     # 4件套重击暴击，过渡向
    mains: [暴击率, 暴击伤害, 攻击力%, 元素精通]
    max_per_slot: 2
  守护之心:                 # 2件套防御+30%，诺艾尔类
    mains: [防御力%, 元素充能效率]
    max_per_slot: 2

  _default:
    mains: [元素充能效率, 暴击率, 暴击伤害, 元素精通]
    sub_any: []
    max_per_slot: 2

version: 3

