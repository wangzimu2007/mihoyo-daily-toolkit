  暴击伤害: 7.77
  攻击力: 5.83
  生命值: 5.83
  防御力: 7.29
  元素精通: 23.31
  元素充能效率: 6.48

useful_generic: [暴击率, 暴击伤害, 攻击力%, 元素充能效率, 元素精通]

main_gate:
  # 稀缺主词条：不看副词条，先留着
  无条件保留:
    时之沙: [元素精通, 元素充能效率]
    空之杯: [元素精通, 火元素伤害, 水元素伤害, 冰元素伤害, 雷元素伤害,
             风元素伤害, 岩元素伤害, 草元素伤害]
    理之冠: [暴击率, 暴击伤害, 元素精通, 治疗加成]
  # 常见主词条：必须有效词条数达标才留（物理杯、攻击杯按社区口径不再无条件留）
  需要评分达标:
    min_rolls: 4.0
    时之沙: [攻击力%, 生命值%, 防御力%]
    空之杯: [攻击力%, 生命值%, 防御力%, 物理伤害]
    理之冠: [攻击力%, 生命值%, 防御力%]

tiers:
  S: 8.0      # 完美件（5★ 满级共 9 次强化）
  A: 7.0
  B: 5.0      # 低于 5 条有效词条 → 评分层面判分解候选

# 热门套装放宽一档：有效词条只要 >= relax_min_rolls 就保留
relax_sets:
  [绝缘之旗印, 深林的记忆, 饰金之梦, 乐园遗落之花, 翠绿之影, 昔日宗室之仪,
   千岩牢固, 逐影猎人, 黄金剧团, 烬城勇者绘卷, 黑曜秘典, 纺月的夜歌, 穹境示现之夜,
   炉火融炼之心, 血红之证, 影中沉凝的幻灭]
relax_min_rolls: 4.0

# 双暴保底线（社区口径：30-35 及格、40+ 保留）：达到即保留，不看有效词条
